name: Deploy Demo

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: demo
    env:
      AZD_ENVIRONMENT: ${{ vars.AZD_ENVIRONMENT }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      PORTAL_ALLOW_ANONYMOUS_ACCESS: ${{ vars.PORTAL_ALLOW_ANONYMOUS_ACCESS }}
      PORTAL_ENTRA_CLIENT_ID: ${{ vars.PORTAL_ENTRA_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      CATALOG_READERS_PRINCIPAL_ID: ${{ secrets.CATALOG_READERS_PRINCIPAL_ID }}
      USECASE_COACH_MCP_ENDPOINT: ${{ secrets.USECASE_COACH_MCP_ENDPOINT }}

    steps:
      - name: Check required demo configuration
        shell: bash
        run: |
          required=(
            AZD_ENVIRONMENT
            AZURE_CLIENT_ID
            AZURE_LOCATION
            AZURE_RESOURCE_GROUP
            PORTAL_ALLOW_ANONYMOUS_ACCESS
            PORTAL_ENTRA_CLIENT_ID
            AZURE_SUBSCRIPTION_ID
            AZURE_TENANT_ID
            CATALOG_READERS_PRINCIPAL_ID
            USECASE_COACH_MCP_ENDPOINT
          )

          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured in the demo GitHub Environment"
              exit 1
            fi
          done

          case "$PORTAL_ALLOW_ANONYMOUS_ACCESS" in
            true|false) ;;
            *)
              echo "::error::PORTAL_ALLOW_ANONYMOUS_ACCESS must be exactly 'true' or 'false'"
              exit 1
              ;;
          esac

          if [ "$PORTAL_ALLOW_ANONYMOUS_ACCESS" = "true" ]; then
            echo "::warning::Anonymous catalog access is explicitly enabled. This is not the private discovery-portal model."
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate azd with federated credential
        shell: bash
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider github \
            --tenant-id "$AZURE_TENANT_ID"

      - name: Verify persistent resource group
        shell: bash
        run: |
          if ! az group show --name "$AZURE_RESOURCE_GROUP" --output none; then
            echo "::error::The persistent demo resource group is unavailable. Restore it and its OIDC role assignments before deploying."
            exit 1
          fi

      - name: Initialize runner-local azd environment
        shell: bash
        run: |
          azd env new "$AZD_ENVIRONMENT" \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --location "$AZURE_LOCATION" \
            --no-prompt
          azd env set AZURE_RESOURCE_GROUP "$AZURE_RESOURCE_GROUP"
          azd env set PORTAL_ALLOW_ANONYMOUS_ACCESS "$PORTAL_ALLOW_ANONYMOUS_ACCESS"
          azd env set PORTAL_ENTRA_CLIENT_ID "$PORTAL_ENTRA_CLIENT_ID"
          azd env set CATALOG_READERS_PRINCIPAL_ID "$CATALOG_READERS_PRINCIPAL_ID"
          azd env set USECASE_COACH_MCP_ENDPOINT "$USECASE_COACH_MCP_ENDPOINT"

      - name: Deploy demo
        id: deploy_demo
        run: azd up --no-prompt

      - name: Check protected portal readiness
        id: portal_readiness
        if: env.PORTAL_ALLOW_ANONYMOUS_ACCESS == 'false'
        continue-on-error: true
        shell: pwsh
        run: |
          $json = & pwsh -NoProfile -File ./scripts/check-portal-readiness.ps1 -OutputFormat json
          $exitCode = $LASTEXITCODE
          if ([string]::IsNullOrWhiteSpace(($json | Out-String))) {
            $exitCode = 1
          }
          else {
            $json | Set-Content -LiteralPath portal-readiness.json -Encoding utf8
          }
          "exit_code=$exitCode" >> $env:GITHUB_OUTPUT
          exit $exitCode

      - name: Report portal completion state
        if: always()
        shell: pwsh
        run: |
          "## Deployment result" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          $deploymentOutcome = "${{ steps.deploy_demo.outcome }}"
          if ($deploymentOutcome -ne "success") {
            "- Infrastructure provisioning: **$deploymentOutcome**." >> $env:GITHUB_STEP_SUMMARY
            "- Portal identity readiness was not evaluated." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          "- Infrastructure provisioning: **completed**." >> $env:GITHUB_STEP_SUMMARY

          if ($env:PORTAL_ALLOW_ANONYMOUS_ACCESS -eq "true") {
            "- Anonymous catalog access was explicitly enabled; private portal readiness was not evaluated." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          if (-not (Test-Path -LiteralPath portal-readiness.json)) {
            "- Private portal readiness: **failed** (the readiness checker did not return a result)." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          $result = Get-Content -LiteralPath portal-readiness.json -Raw | ConvertFrom-Json
          "- Static private portal readiness: **$($result.status)**." >> $env:GITHUB_STEP_SUMMARY
          foreach ($check in $result.checks) {
            "- $($check.outcome): $($check.message)" >> $env:GITHUB_STEP_SUMMARY
          }
          "- A clean-browser non-owner acceptance test is still required before declaring the portal operational." >> $env:GITHUB_STEP_SUMMARY

      - name: Fail known portal misconfiguration
        if: >-
          env.PORTAL_ALLOW_ANONYMOUS_ACCESS == 'false' &&
          steps.portal_readiness.outputs.exit_code != '0' &&
          steps.portal_readiness.outputs.exit_code != '2'
        shell: bash
        run: |
          echo "::error::The protected portal has a known configuration failure. Review the deployment summary."
          exit 1
