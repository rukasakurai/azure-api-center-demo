name: Azure OIDC Connectivity Check

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  validate-azure-oidc:
    runs-on: ubuntu-latest
    environment: demo
    
    steps:
      - name: Check required demo configuration
        run: |
          if [ -z "${{ vars.AZURE_CLIENT_ID }}" ]; then
            echo "::error::AZURE_CLIENT_ID is not configured in the demo GitHub Environment"
            exit 1
          fi
          if [ -z "${{ secrets.AZURE_TENANT_ID }}" ]; then
            echo "::error::AZURE_TENANT_ID is not configured in the demo GitHub Environment"
            exit 1
          fi
          if [ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "::error::AZURE_SUBSCRIPTION_ID is not configured in the demo GitHub Environment"
            exit 1
          fi
          if [ -z "${{ vars.AZURE_RESOURCE_GROUP }}" ]; then
            echo "::error::AZURE_RESOURCE_GROUP is not configured in the demo GitHub Environment"
            exit 1
          fi
      
      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Verify Azure connectivity
        run: |
          az account show \
            --query "{subscriptionName:name,state:state,tenantName:tenantDisplayName}"
          az group show \
            --name "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "{name:name,location:location}"
